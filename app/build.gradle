apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}
def secretsProperties = new Properties()
def secretsFile = new File(rootDir, "secrets.properties")
if (secretsFile.exists()) {
    secretsFile.withInputStream { secretsProperties.load(it) }
} else {
    secretsProperties.put("partnerToken", "1234567890")
}

android {
    namespace 'io.bumbumapps.radio.internetradioplayer'
    compileSdk 36
    defaultConfig {
        applicationId "com.bumbumapps.radiofm"
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName "3.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "PARTNER_TOKEN", "\"${secretsProperties['partnerToken']}\"")
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        debug {
            // Google sample IDs: debug builds never request live ads.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~9472122187"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/6654387151"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
}

kapt {
    correctErrorTypes true
    arguments {
        arg("toothpick_registry_package_name", "com.bumbumapps.radiofm")
        arg("room.schemaLocation", "$projectDir/schemas".toString())
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    //Support
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.media:media:1.7.1"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.palette:palette:1.0.0"
    //DB
    implementation "androidx.room:room-runtime:2.7.2"
    kapt "androidx.room:room-compiler:2.7.2"
    implementation "androidx.room:room-rxjava2:2.7.2"
    //Net
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    //Rx
    implementation "io.reactivex.rxjava2:rxjava:2.2.21"
    implementation "io.reactivex.rxjava2:rxkotlin:2.4.0"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "com.jakewharton.rxrelay2:rxrelay:2.1.1"
    //DI
    implementation "com.github.stephanenicolas.toothpick:toothpick-runtime:1.1.3"
    kapt "com.github.stephanenicolas.toothpick:toothpick-compiler:1.1.3"
    //Image loading
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "com.github.bumptech.glide:annotations:4.16.0"
    kapt "com.github.bumptech.glide:compiler:4.16.0"
    implementation "com.github.bumptech.glide:okhttp3-integration:4.16.0"
    implementation "com.github.mkaflowski:Media-Style-Palette:1.3"
    //Logging
    implementation "com.jakewharton.timber:timber:4.7.1"
    //ExoPlayer
    implementation "com.google.android.exoplayer:exoplayer-core:2.19.1"
    implementation "com.google.android.exoplayer:extension-okhttp:2.19.1"
    implementation 'androidx.work:work-runtime-ktx:2.10.5'

    //ads
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation project(':playerbutton')
}
